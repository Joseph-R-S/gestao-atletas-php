    <!-- Script sencillo para controlar la transición suave del menú -->
    <script>
        // 1. Al cargar la página, verificamos inmediatamente el estado guardado
        document.addEventListener("DOMContentLoaded", function () {
            const wrapper = document.getElementById('wrapper');
            const sidebarState = localStorage.getItem('sidebar-hidden');
            const isMobile = window.innerWidth < 768;

            // Si en la sesión anterior el usuario lo ocultó (y está en escritorio), lo aplicamos antes de que parpadee
            if (!isMobile && sidebarState === 'true') {
                wrapper.classList.add('sidebar-hidden');
            }
        });

        // 2. Modificamos la función para que guarde la preferencia en cada clic
        function toggleSidebar() {
            const wrapper = document.getElementById('wrapper');
            const isMobile = window.innerWidth < 768;

            if (isMobile) {
                wrapper.classList.toggle('sidebar-show-mobile');
            } else {
                wrapper.classList.toggle('sidebar-hidden');

                // Guardamos true o false en el navegador según si tiene la clase aplicada
                const isHidden = wrapper.classList.contains('sidebar-hidden');
                localStorage.setItem('sidebar-hidden', isHidden);
            }
        }
    </script>
